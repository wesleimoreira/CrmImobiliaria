services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    # Sem porta publicada no host — o proxy Caddy (rede externa "proxy") expõe
    # publicamente, via example.com, com HTTPS automático.

networks:
  proxy:
    external: true
