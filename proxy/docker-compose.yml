services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    # Único serviço com porta publicada no host — emite e renova HTTPS sozinho
    # (Let's Encrypt) e roteia por domínio pros containers do CRM e da landing.

networks:
  proxy:
    external: true

volumes:
  caddy_data:
  caddy_config:
