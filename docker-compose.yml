services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - crm_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Sem "ports": o banco só é alcançável pelo serviço web dentro da rede interna do compose.

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CrmImobiliaria: "Server=db;Database=CrmImobiliaria;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
    volumes:
      - crm_dataprotection_keys:/app/keys
    expose:
      - "8080"
    networks:
      - default
      - proxy
    # Não publica porta no host — o proxy Caddy (rede externa "proxy") é quem expõe
    # publicamente, via crm.primefrota.cloud, com HTTPS automático.

networks:
  proxy:
    external: true

volumes:
  crm_db_data:
  crm_dataprotection_keys:
